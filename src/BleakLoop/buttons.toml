# Every button: where it sits, its manual label and text, and the status messages it shows.
#
# The table path is the button's ID. Fields:
#   section  the manual section the button belongs to (tools/docs/manual/pads.py SECTIONS)
#   pad      [column, pad]; column 1 is the Global column, pad 1 the far row
#   label    the manual pad map's label, at most 7 characters
#   group    a set of pads read together, such as the tempo steps; value is each pad's value
#
# Fixed regions (clip grid, scene pads, faders, Mute/Select rows) aren't movable.

manual_format = "{label}."

# The Global column: the same pads in every mode.

[global.play_stop]
section = "global"
pad = [1, 1]
label = "Play"

[global.record]
section = "global"
pad = [1, 2]
label = "Record"

[global.capture]
section = "global"
pad = [1, 3]
label = "Capture"

[global.quantize]
section = "global-shift"
pad = [1, 3]
label = "Quant"

[global.metronome]
section = "global"
pad = [1, 4]
label = "Metro"

[global.launch_quantization]
section = "global-shift"
pad = [1, 4]
label = "LaunchQ"

[global.fixed_length]
section = "global"
pad = [1, 5]
label = "Length"

[global.undo]
section = "global"
pad = [1, 6]
label = "Undo"

[global.mode]
section = "global"
pad = [1, 7]
label = "Linn"

[global.scene_page]
section = "linnstrument-shift"
pad = [1, 7]
label = "Scenes"

[global.shift]
section = "global"
pad = [1, 8]
label = "Shift"

# The Navigation column.

[nav.session]
section = "navigation"
pad = [16, 1]
label = "Session"

[nav.mixer]
section = "navigation"
pad = [16, 2]
label = "Mixer"

[nav.fx]
section = "navigation"
pad = [16, 3]
label = "FX"

[nav.fader_source]
section = "navigation-shift"
pad = [16, 3]
label = "Source"

# Unlit and unused until Chord is built.
[nav.reserved]
section = "navigation"
pad = [16, 4]

[nav.seq]
section = "navigation"
pad = [16, 5]
label = "Seq"

[nav.delete]
section = "navigation"
pad = [16, 6]
label = "Delete"

[nav.copy]
section = "navigation"
pad = [16, 7]
label = "Copy"

[nav.device_clip]
section = "navigation"
pad = [16, 8]
label = "DevClip"

# Shift + column 16: value is the window's (track step, scene step).

[nav.window_up]
section = "navigation-shift"
pad = [16, 5]
group = "nav.window"
value = [0, -1]
label = "Up"

[nav.window_down]
section = "navigation-shift"
pad = [16, 6]
group = "nav.window"
value = [0, 1]
label = "Down"

[nav.window_right]
section = "navigation-shift"
pad = [16, 7]
group = "nav.window"
value = [1, 0]
label = "Right"

[nav.window_left]
section = "navigation-shift"
pad = [16, 8]
group = "nav.window"
value = [-1, 0]
label = "Left"

# Shift + column 16: value is the BPM step.

[nav.tempo_up]
section = "navigation-shift"
pad = [16, 1]
group = "nav.tempo"
value = 1
label = "Tempo+"

[nav.tempo_down]
section = "navigation-shift"
pad = [16, 2]
group = "nav.tempo"
value = -1
label = "Tempo-"

# Column 15 in Session, Mixer and FX Mode.

[view.unmute_all]
section = "view"
pad = [15, 7]
label = "Unmute"

[view.stop]
section = "view"
