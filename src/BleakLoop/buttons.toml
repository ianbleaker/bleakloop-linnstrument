# Every button: where it sits and the function it runs, and each function's label, manual
# text and status messages.
#
# Edit a pad here and restart Live to move a button; nothing else to build. Check the file
# first, from the repo: PYTHONPATH=src python3 -m tools.check_buttons
#
# [<section>.<name>] is a button. Fields:
#   pad    [column, pad]; column 1 is the Global column, pad 1 the far row
#   does   the function it runs (src/BleakLoop/core/catalogue.py); default: the button's name
#   value  the function's setting for this pad, as a tempo step or a snapshot slot
#   label  this pad's label on the manual's pad map, at most 7 characters, over the function's
#
# [functions.<name>] is a function, wherever its buttons sit: its label, at most 7
# characters, and later its manual text and messages.
#
# Linnstrument and Sequencer Mode's sections fall back to the Session ones: a pad they don't
# list does what it does in Session Mode, and is dark if that function can't run there.
# Every button moves alone, Shift functions included. Fixed regions (clip grid, scene pads,
# faders, steps, Mute/Select rows) aren't movable, and no two buttons live at once may share
# a pad. In Linnstrument Mode only column 1 reaches BleakLoop, so its own sections stay there.

manual_format = "{label}."


# The Global column in Session, Mixer and FX Mode.

[global.play_stop]
pad = [1, 1]

[global.record]
pad = [1, 2]

[global.capture]
pad = [1, 3]

[global.metronome]
pad = [1, 4]

[global.fixed_length]
pad = [1, 5]

[global.undo]
pad = [1, 6]

[global.linnstrument_mode]
pad = [1, 7]

[global.shift]
pad = [1, 8]


# Shift held, in Session, Mixer and FX Mode.

[global_shift.stop_all]
pad = [1, 1]

[global_shift.quantize]
pad = [1, 3]

[global_shift.launch_quantization]
pad = [1, 4]

[global_shift.redo]
pad = [1, 6]


# Linnstrument Mode's Global column: only what differs from Session Mode's. Column 1 only.

[linnstrument.record_clip]
pad = [1, 2]

[linnstrument.capture_midi]
pad = [1, 3]

[linnstrument.back]
pad = [1, 7]


# Shift held, in Linnstrument Mode: only what differs. Column 1 only.

[linnstrument_shift.stop_track]
pad = [1, 1]

[linnstrument_shift.record]
pad = [1, 2]

[linnstrument_shift.scene_page]
pad = [1, 7]


# The scene page, in Linnstrument and Sequencer Mode: pads 1-6 are the scenes.

[linnstrument_scenes.back]
pad = [1, 8]
does = "close_scenes"


# Sequencer Mode's Global column: only what differs from Session Mode's.

[sequencer_global.record_clip]
