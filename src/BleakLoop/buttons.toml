# Every button: where it sits, its manual label and text, and the status messages it shows.
#
# Edit a pad here and restart Live to move a button; nothing else to build. Check the file
# first, from the repo: PYTHONPATH=src python3 -m tools.check_buttons
#
# The table path is the button's ID: its section, then its name. Fields:
#   section  the section the button belongs to: the mode and layer it works in
#   pad      [column, pad]; column 1 is the Global column, pad 1 the far row
#   label    the manual pad map's label, at most 7 characters
#   group    a set of pads read together, such as the tempo steps; value is each pad's value
#
# Every button moves alone, Shift functions included. Fixed regions (clip grid, scene pads,
# faders, steps, Mute/Select rows) aren't movable, and no two buttons live at once may share
# a pad. In Linnstrument Mode only column 1 reaches BleakLoop, so its sections stay there.

manual_format = "{label}."


